# Alpamayo 1.5 -> Cosmos 3 Edge distillation

paths:
  dataset_root: data/physicalai-av
  cache_root: data/distill_cache
  runs_root: outputs/runs
  b2d_cache_root: data/b2d_cache_b2dnorm
  teacher_repo: models/alpamayo-1.5-10b
  student_repo: models/cosmos3-edge

data:
  num_clips: 5000
  increments: [500, 2000, 5000]
  windows_per_clip: 2
  cameras: [camera_cross_left_120fov, camera_front_wide_120fov, camera_cross_right_120fov,
            camera_front_tele_30fov]
  context_frames: 4                          # frames per camera
  student_resolution: [360, 640]             # (H, W)
  cache_student_frames: true
  frame_jpeg_quality: 92
  split:
    holdout_countries: [JPN, ZAF]
    val_fraction: 0.05
    debug_clips: 100
  curation:
    strata_weights:
      intersection: 3.0
      pedestrian: 3.0
      cut_in: 4.0
      construction: 4.0
      adverse_weather: 2.0
      night: 2.0
      default: 1.0

teacher:
  dtype: bf16
  max_coc_tokens: 48
  topk_logits: 32
  flow_targets_per_window: 12
  timestep_stratification: uniform
  n_traj_samples: 4
  expert_batch: 4
  prefetch_workers: 4
  prefetch_depth: 6
  gen_top_p: 0.98
  gen_temperature: 0.6
  feat_layers: [3, 8, 12, 17, 21, 26, 30, 35]
  feat_pool_len: 8

student:
  lora:
    stage1:                                  # AR/reasoner tower
      enabled: true
      rank: 48
      alpha: 96
      targets: [q_proj, k_proj, v_proj, o_proj]
    stage2:                                  # gen tower
      enabled: false                         # false = full FT
      rank: 16
      alpha: 32
      targets: [q_proj_moe_gen, k_proj_moe_gen, v_proj_moe_gen, o_proj_moe_gen]
    stage2_ar:                               # AR-tower LoRA during stage 2
      enabled: true
      rank: 48
      alpha: 96
      targets: [q_proj, k_proj, v_proj, o_proj]
      lr_mult: 2.0
    train_shared_action_embeds: false
  new_token_lr_mult: 8.0
  action_domain_id: 31
  layer_map:
    mode: cka
    cka_probe_batches: 4

stage1:
  epochs: 12
  micro_batch: 4
  grad_accum: 8
  lr: 1.0e-4
  warmup_frac: 0.03
  weight_decay: 0.05
  grad_checkpoint: false
  traj_prefix: gt
  route_hint: true
  image_dropout: 0.0
  filter_contradictions: true
  prefix_noise_bins: 64.0
  prefix_mask_prob: 0.25
  loss_weights:
    traj_kl: 0.0
    traj_kl_accel: 0.0
    text_kl: 1.0
    feat: 0.0
    gt_ce: 1.0
    struct_ce: 0.5
  gt_soft_sigma_bins: 6.0
  feat_warmup_frac: 0.1
  select_on: coc_gt                          # coc_gt | minade | coc_nll
  coc_gt_windows: 400
  coc_gt_max_new_tokens: 64
  early_stop_patience: 3
  save_every_epoch: true
  maneuver_sampling:
    enabled: false
    alpha: 0.5

stage1_rl:
  init_ckpt: ${paths.runs_root}/stage1/best
  run_name: grpo-coc
  cameras: [camera_cross_left_120fov, camera_front_wide_120fov, camera_cross_right_120fov,
            camera_front_tele_30fov]
  route_hint: true
  group_size: 16
  prompts_per_step: 8
  prompt_alpha: 0.5
  steps: 50
  traj_loss_weight: 1.0
  score_chunk: 4
  lr: 3.0e-5
  grad_clip: 1.0
  kl_beta: 0.03
  ce_aux: 0.1
  temperature: 0.6
  top_p: 0.98
  coc_temperature: 1.0
  max_new_tokens: 64
  eval_every: 5
  eval_windows: 400
  select_on: gt_score
  seed: 0
  reward:
    mode: gt                                 # gt | perspan | teacher
    strict: true
    unverifiable: -0.25
    self_consistency: 0.5
    ade: 1.0
    ade_cap: 8.0
    kin: 1.0
    dir: 0.5
    hazard: 0.0
    teacher: 0.0
    maneuver: 1.0
    direction: 0.5
    objects: 0.5
    false_clear: 1.0
    fail: -2.0
    max_tokens: 48

stage2:
  dataset: bench2drive                       # physicalai | bench2drive
  coc_cache: /bulk/users/vla/alpamayo2edge/b2d_cache/coc_rl7s25.jsonl
  supervision: gt_flow                       # teacher_flow | gt_flow
  init_ckpt: ${paths.runs_root}/stage1/run-351/best
  init_adapters: ${paths.runs_root}/stage1_rl/rl-run-7-coc-grounded/step-0025
  epochs: 8
  micro_batch: 2
  grad_accum: 16
  lr: 5.0e-5
  warmup_frac: 0.03
  weight_decay: 0.0
  grad_checkpoint: true
  fp32_master: true
  k_samples: 8
  t_sampler: beta                            # beta | stratified | logitnormal
  sample_steps: 10
  run_name: sft-run-5-b2d-tbeta-t0gate
  buckets:
    enabled: false
    share:
      standing: 0.05
      start: 0.18
      hard_brake: 0.12
      to_stop: 0.13
      brake: 0.10
      turn: 0.18
      accel: 0.12
      cruise: 0.12
  gate_windows: 863
  gate_k: 6
  gate_metric: t0_ade                        # t0_ade | minade
  gate_batch: 8
  wandb: true
  wandb_project: alpamayostudent
  loss_weights:
    flow_distill: 1.0
    fm_gt: 0.5
    traj: 0.1
    coc_ce: 1.0
  traj_loss_t_power: 1.0
  anneal_to_gt_frac: 0.2
  scheduled_sampling_start_frac: 0.5

eval:
  horizon_s: 6.4
  minade_k: 6
  gate_max_windows: 60
  challenging_split: challenging_v1
  retention:
    baseline_dir: /data/vla/alpamayo2edge/runs/retention_base
    probe_file: src/distill/eval/probes/general_probes.json
    max_new_tokens: 64
    generic_clips_dir: null
    n_generic_clips: 16
    flow_probe_timesteps: [0.1, 0.3, 0.5, 0.7, 0.9]
    seed: 0
